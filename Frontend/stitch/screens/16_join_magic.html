<h1 class="font-headline-md-mobile text-headline-md-mobile md:font-headline-md md:text-headline-md text-on-background">Create an Account</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Step into a world of everyday magic and handmade elegance.</p>

<!-- Registration Form -->
<form action="#" class="flex flex-col gap-stack-md" method="POST">
<!-- Full Name Input -->
<div class="flex flex-col gap-2">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider" for="fullname">Full Name</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-0 top-1/2 -translate-y-1/2 text-outline-variant ml-2" style="font-variation-settings: &quot;FILL&quot; 0;">person</span>
<input class="w-full bg-surface-container-low border-b-2 border-outline-variant text-on-background focus:outline-none focus:border-primary py-3 pl-10 pr-2 font-body-md text-body-md transition-colors placeholder:text-outline/50 bg-transparent rounded-t-sm" id="fullname" name="fullname" placeholder="Jane Doe" required="" type="text">
</div>
</div>
<!-- Email Input -->
<div class="flex flex-col gap-2">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-0 top-1/2 -translate-y-1/2 text-outline-variant ml-2" style="font-variation-settings: &quot;FILL&quot; 0;">mail</span>
<input class="w-full bg-surface-container-low border-b-2 border-outline-variant text-on-background focus:outline-none focus:border-primary py-3 pl-10 pr-2 font-body-md text-body-md transition-colors placeholder:text-outline/50 bg-transparent rounded-t-sm" id="email" name="email" placeholder="jane@example.com" required="" type="email">
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-2">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider" for="password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-0 top-1/2 -translate-y-1/2 text-outline-variant ml-2" style="font-variation-settings: &quot;FILL&quot; 0;">lock</span>
<input class="w-full bg-surface-container-low border-b-2 border-outline-variant text-on-background focus:outline-none focus:border-primary py-3 pl-10 pr-2 font-body-md text-body-md transition-colors placeholder:text-outline/50 bg-transparent rounded-t-sm" id="password" name="password" placeholder="••••••••" required="" type="password">
</div>
</div>
<!-- Submit Button -->
<button class="mt-stack-sm w-full bg-primary-container text-on-primary-container font-label-md text-label-md py-3 px-8 rounded-DEFAULT hover:shadow-[0px_4px_20px_rgba(183,110,121,0.15)] hover:-translate-y-0.5 transition-all duration-300 flex items-center justify-center gap-2" type="submit">
